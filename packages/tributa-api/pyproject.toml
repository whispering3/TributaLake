[project]
name = "tributa-api"
version = "0.1.0"
description = "API HTTP e portal local do TributaLake."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "fiscal-spec",
  "fiscal-store",
  "pytz>=2025.2",
  "python-multipart>=0.0.20",
  "sped-reader",
  "uvicorn>=0.34.0",
]

[project.scripts]
tributa-api = "tributa_api.main:run"

[tool.uv.sources]
fiscal-spec = { workspace = true }
fiscal-store = { workspace = true }
sped-reader = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tributa_api"]
include = ["src/tributa_api/static/*.html"]
