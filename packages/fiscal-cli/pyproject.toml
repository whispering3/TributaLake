[project]
name = "tributa-lake"
version = "0.1.0"
description = "Interface de linha de comando do TributaLake."
requires-python = ">=3.12"
dependencies = [
  "dfe-tabular",
  "fiscal-spec",
  "fiscal-store",
  "sped-reader",
  "typer>=0.15.0",
]

[project.scripts]
tributa = "fiscal_cli.main:app"

[tool.uv.sources]
dfe-tabular = { workspace = true }
fiscal-spec = { workspace = true }
fiscal-store = { workspace = true }
sped-reader = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fiscal_cli"]
