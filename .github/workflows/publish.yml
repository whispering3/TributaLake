name: Publish packages

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Versão semântica aprovada para o release
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: >-
          python -m build --outdir dist packages/fiscal-model &&
          python -m build --outdir dist packages/fiscal-store &&
          python -m build --outdir dist packages/fiscal-spec &&
          python -m build --outdir dist packages/sped-reader &&
          python -m build --outdir dist packages/dfe-tabular &&
          python -m build --outdir dist packages/fiscal-synth &&
          python -m build --outdir dist packages/fiscal-cli
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/tributa-lake/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
